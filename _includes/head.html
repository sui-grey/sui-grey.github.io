<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  {%- comment -%} minima 2.5.1 head.html + GoatCounter (cookie-free page counts, dashboard at sui-grey.goatcounter.com) {%- endcomment -%}
  <script data-goatcounter="https://sui-grey.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <noscript><img src="https://sui-grey.goatcounter.com/count?p={{ page.url | uri_escape }}&t={{ page.title | uri_escape }}" alt=""></noscript>
</head>
